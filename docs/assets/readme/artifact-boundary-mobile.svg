<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1168" viewBox="0 0 800 1168" role="img" aria-labelledby="title desc">
<title id="title">Artifact boundary mobile</title><desc id="desc">Vertical roles for official final, reproducibility, and historical artifacts.</desc>
<rect width="800" height="1168" rx="32" fill="#0B1220"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <g data-title="true"><text x="64" y="80" fill="#F8FAFC" font-size="36" font-weight="830"><tspan>ARTIFACT BOUNDARY</tspan></text></g>
  <text x="64" y="126" fill="#94A3B8" font-size="24"><tspan>Identity · reproducibility · history</tspan></text>
  <g data-grid="16">
    <rect x="64" y="176" width="672" height="272" rx="24" fill="#0F2236" stroke="#38BDF8"/>
    <rect x="64" y="464" width="672" height="272" rx="24" fill="#17142A" stroke="#A78BFA"/>
    <rect x="64" y="752" width="672" height="304" rx="24" fill="#101A2B" stroke="#475569"/>
  </g>
  <text x="96" y="226" fill="#38BDF8" font-size="24" font-weight="820"><tspan>OFFICIAL FINAL</tspan></text><text x="96" y="286" fill="#F8FAFC" font-size="34" font-weight="800"><tspan>Canonical artifact identity</tspan></text><text x="96" y="340" fill="#CBD5E1" font-size="25"><tspan>Team-supplied original files</tspan></text><text x="96" y="378" fill="#CBD5E1" font-size="25"><tspan>SHA-256 + Git blob record</tspan></text>
  <text x="96" y="514" fill="#A78BFA" font-size="24" font-weight="820"><tspan>POST-SUBMISSION</tspan></text><text x="96" y="574" fill="#F8FAFC" font-size="34" font-weight="800"><tspan>Reproducibility surface</tspan></text><text x="96" y="628" fill="#CBD5E1" font-size="25"><tspan>v6.2 notebooks · validator · audit</tspan></text>
  <text x="96" y="802" fill="#94A3B8" font-size="24" font-weight="820"><tspan>HISTORICAL</tspan></text><text x="96" y="862" fill="#F8FAFC" font-size="34" font-weight="800"><tspan>Research history</tspan></text><text x="96" y="916" fill="#CBD5E1" font-size="25"><tspan>Prior notebooks · screenshots · exploration</tspan></text><text x="96" y="954" fill="#CBD5E1" font-size="25"><tspan>preserved without canonical-final claims</tspan></text>
</g>
</svg>