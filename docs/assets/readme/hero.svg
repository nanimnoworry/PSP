<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">Fertility PSP official evidence ledger</title>
<desc id="desc">Official project SSOT emphasizing the distinction between highest submitted score, final adopted submission model, and canonical artifact provenance.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111F"/><stop offset=".62" stop-color="#0B1220"/><stop offset="1" stop-color="#111C2F"/></linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="560" rx="32" fill="url(#bg)"/>
<rect x="80" y="64" width="752" height="432" fill="none" opacity="0" id="text-safe-zone"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <g data-title="true"><text x="96" y="116" fill="#38BDF8" font-size="20" font-weight="800" letter-spacing="4"><tspan>OFFICIAL PROJECT · EVIDENCE LEDGER</tspan></text></g>
  <text x="96" y="206" fill="#F8FAFC" font-size="68" font-weight="850"><tspan>FERTILITY PSP</tspan></text>
  <text x="96" y="258" fill="#CBD5E1" font-size="28" font-weight="700"><tspan>Final result · lineage · artifact provenance</tspan></text>
  <text x="96" y="320" fill="#94A3B8" font-size="20"><tspan>Structural missingness · OOF-first validation · ensemble diversity</tspan></text>
  <g data-grid="16">
    <rect x="96" y="384" width="224" height="64" rx="16" fill="#0F2236" stroke="#38BDF8"/>
    <rect x="336" y="384" width="208" height="64" rx="16" fill="#17142A" stroke="#A78BFA"/>
    <rect x="560" y="384" width="208" height="64" rx="16" fill="#271923" stroke="#FF7A66"/>
  </g>
  <text x="120" y="424" fill="#BAE6FD" font-size="18" font-weight="800"><tspan>OFFICIAL SSOT</tspan></text>
  <text x="360" y="424" fill="#DDD6FE" font-size="18" font-weight="800"><tspan>HASH PROVENANCE</tspan></text>
  <text x="584" y="424" fill="#FFD2CA" font-size="18" font-weight="800"><tspan>PUBLIC BOUNDARY</tspan></text>

  <g id="ledger-zone" transform="translate(912 72)">
    <text x="0" y="24" fill="#64748B" font-size="14" font-weight="800" letter-spacing="2"><tspan>CANONICAL RECORD</tspan></text>
    <g data-grid="16">
      <rect x="0" y="64" width="592" height="96" rx="16" fill="#0F2236" stroke="#38BDF8"/>
      <rect x="0" y="176" width="592" height="96" rx="16" fill="#17142A" stroke="#A78BFA"/>
      <rect x="0" y="288" width="592" height="96" rx="16" fill="#101A2B" stroke="#475569"/>
    </g>
    <text x="24" y="100" fill="#38BDF8" font-size="14" font-weight="800"><tspan>HIGHEST SUBMITTED</tspan></text>
    <text x="24" y="140" fill="#F8FAFC" font-size="28" font-weight="840"><tspan>PLAN 2 · 0.74232</tspan></text>
    <text x="24" y="212" fill="#A78BFA" font-size="14" font-weight="800"><tspan>FINAL ADOPTED SUBMISSION MODEL</tspan></text>
    <text x="24" y="252" fill="#F8FAFC" font-size="28" font-weight="840"><tspan>PLAN 3 · 0.74231</tspan></text>
    <text x="24" y="324" fill="#94A3B8" font-size="14" font-weight="800"><tspan>ARTIFACT IDENTITY</tspan></text>
    <text x="24" y="364" fill="#F8FAFC" font-size="24" font-weight="780"><tspan>Filename &lt; SHA-256 / Git blob</tspan></text>
    <circle cx="552" cy="112" r="7" fill="#38BDF8" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="552" cy="224" r="7" fill="#A78BFA" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>
</g>
</svg>