<svg xmlns="http://www.w3.org/2000/svg" width="800" height="944" viewBox="0 0 800 944" role="img" aria-labelledby="title desc">
<title id="title">Fertility PSP mobile official evidence ledger</title>
<desc id="desc">Mobile-first official project identity and canonical result cards.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111F"/><stop offset="1" stop-color="#17142A"/></linearGradient></defs>
<rect width="800" height="944" rx="32" fill="url(#bg)"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <g data-title="true"><text x="64" y="88" fill="#38BDF8" font-size="26" font-weight="820" letter-spacing="2"><tspan>OFFICIAL PROJECT · EVIDENCE LEDGER</tspan></text></g>
  <text x="64" y="176" fill="#F8FAFC" font-size="62" font-weight="850"><tspan>FERTILITY PSP</tspan></text>
  <text x="64" y="230" fill="#CBD5E1" font-size="30" font-weight="700"><tspan>Final result · lineage · provenance</tspan></text>
  <g data-grid="16">
    <rect x="64" y="304" width="672" height="192" rx="24" fill="#0F2236" stroke="#38BDF8"/>
