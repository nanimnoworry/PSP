    <rect x="64" y="720" width="672" height="144" rx="24" fill="#101A2B" stroke="#475569"/>
  </g>
  <text x="96" y="354" fill="#38BDF8" font-size="24" font-weight="820"><tspan>HIGHEST SUBMITTED</tspan></text>
  <text x="96" y="428" fill="#F8FAFC" font-size="48" font-weight="850"><tspan>PLAN 2 · 0.74232</tspan></text>
  <text x="96" y="562" fill="#A78BFA" font-size="24" font-weight="820"><tspan>FINAL ADOPTED SUBMISSION MODEL</tspan></text>
  <text x="96" y="636" fill="#F8FAFC" font-size="48" font-weight="850"><tspan>PLAN 3 · 0.74231</tspan></text>
  <text x="96" y="770" fill="#94A3B8" font-size="24" font-weight="820"><tspan>ARTIFACT IDENTITY</tspan></text>
  <text x="96" y="824" fill="#F8FAFC" font-size="28" font-weight="760"><tspan>Filename &lt; SHA-256 / Git blob</tspan></text>
