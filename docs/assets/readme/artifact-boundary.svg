<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
<title id="title">Artifact and reproducibility boundary</title>
<desc id="desc">Three clearly separated roles: official final identity, post-submission reproducibility, and historical research material.</desc>
<rect width="1600" height="480" rx="32" fill="#0B1220"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <g data-title="true"><text x="80" y="72" fill="#F8FAFC" font-size="30" font-weight="830"><tspan>ARTIFACT &amp; REPRODUCIBILITY BOUNDARY</tspan></text></g>
  <text x="80" y="108" fill="#64748B" font-size="17"><tspan>Identity, reproducibility, and history are related — but never collapsed into one file.</tspan></text>
  <g data-grid="16">
    <rect x="80" y="160" width="448" height="224" rx="24" fill="#0F2236" stroke="#38BDF8"/>
    <rect x="544" y="160" width="448" height="224" rx="24" fill="#17142A" stroke="#A78BFA"/>
    <rect x="1008" y="160" width="512" height="224" rx="24" fill="#101A2B" stroke="#475569"/>
  </g>
  <text x="112" y="210" fill="#38BDF8" font-size="15" font-weight="820" letter-spacing="2"><tspan>OFFICIAL FINAL</tspan></text>
  <text x="112" y="258" fill="#F8FAFC" font-size="27" font-weight="800"><tspan>Canonical artifact identity</tspan></text>
  <text x="112" y="302" fill="#CBD5E1" font-size="17"><tspan>Team-supplied original files</tspan></text>
  <text x="112" y="332" fill="#CBD5E1" font-size="17"><tspan>SHA-256 + Git blob record</tspan></text>

  <text x="576" y="210" fill="#A78BFA" font-size="15" font-weight="820" letter-spacing="2"><tspan>POST-SUBMISSION</tspan></text>
  <text x="576" y="258" fill="#F8FAFC" font-size="27" font-weight="800"><tspan>Reproducibility surface</tspan></text>
  <text x="576" y="302" fill="#CBD5E1" font-size="17"><tspan>v6.2 notebooks · validator</tspan></text>
  <text x="576" y="332" fill="#CBD5E1" font-size="17"><tspan>execution contract · audit</tspan></text>

  <text x="1040" y="210" fill="#94A3B8" font-size="15" font-weight="820" letter-spacing="2"><tspan>HISTORICAL</tspan></text>
  <text x="1040" y="258" fill="#F8FAFC" font-size="27" font-weight="800"><tspan>Research history</tspan></text>
  <text x="1040" y="302" fill="#CBD5E1" font-size="17"><tspan>Prior notebooks · screenshots · exploration</tspan></text>
  <text x="1040" y="332" fill="#CBD5E1" font-size="17"><tspan>Preserved without being presented as canonical final.</tspan></text>
</g>
</svg>